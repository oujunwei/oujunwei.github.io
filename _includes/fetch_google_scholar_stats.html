<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            var totalCitation = data['citedby']
            var totalCitElem = document.getElementById('total_cit')
            if (totalCitElem) {
                totalCitElem.innerHTML = totalCitation;
            }

            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var publication = data['publications'][paperId]
                if (publication) {
                    var numCitations = publication['num_citations']
                    element.innerHTML = '| Citations: ' + numCitations;
                }
            });

            var publicationsList = document.getElementById('publications-list')
            if (publicationsList && data['publications']) {
                var publications = Object.values(data['publications'])
                publications.sort((a, b) => (b.num_citations || 0) - (a.num_citations || 0))
                publications = publications.slice(0, 10)
                var listHtml = '<ol class="publications-list">'
                publications.forEach(pub => {
                    var title = pub.title || (pub.bib && pub.bib.title) || 'Untitled'
                    var url = pub.url_scholar || (pub.bib && pub.bib.url) || null
                    var citations = pub.num_citations || 0
                    listHtml += '<li>'
                    if (url) {
                        listHtml += '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + title + '</a>'
                    } else {
                        listHtml += title
                    }
                    listHtml += ' <span class="pub-citations">(' + citations + ' citations)</span>'
                    listHtml += '</li>'
                })
                listHtml += '</ol>'
                publicationsList.innerHTML = listHtml
            }
        }).fail(function () {
            var publicationsList = document.getElementById('publications-list')
            if (publicationsList) {
                publicationsList.innerHTML = '<p>Unable to load Google Scholar publications right now.</p>'
            }
        });
    })
</script>
