name: Auto Update Google Scholar Stats

on:
  schedule:
    # Runs daily at 08:23 UTC (avoids the :00/:30 rush)
    - cron: '23 8 * * *'
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Google Scholar data
        run: python fetch_scholar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
          else
            git commit -m "🤖 Auto-update Google Scholar stats"
            git push
          fi
